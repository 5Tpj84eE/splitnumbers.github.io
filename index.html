<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>いくつといくつ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #d3d3d3;
      font-family: sans-serif;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      margin: 0;
    }

    .split-area {
      position: relative;
      width: 260px;
    }

    .number-box {
      width: 100px;
      height: 100px;
      background: #fff;
      border-radius: 12px;

      font-size: 48px;
      font-weight: bold;
      color: #37474F;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      z-index: 2;
    }

    .top {
      margin: 0 auto;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
    }

    .hidden-box {
      background: #b0bec5;
      cursor: pointer;
    }

    .branch-line {
      position: absolute;
      top: 90px;
      left: 50%;
      width: 2px;
      height: 80px;
      background: #607D8B;
      transform-origin: top;
      z-index: 1;
    }

    .branch-line.left {
      transform: translateX(-1px) rotate(-30deg);
    }

    .branch-line.right {
      transform: translateX(-1px) rotate(30deg);
    }

    button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;

      background: #3f51b5;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="split-area">
    <div class="number-box top" id="main"></div>

    <div class="branch-line left"></div>
    <div class="branch-line right"></div>

    <div class="bottom-row">
      <div class="number-box" id="left"></div>
      <div class="number-box hidden-box" id="right"></div>
    </div>
  </div>

  <button id="new">もういっかい</button>

  <script>
    const main = document.getElementById("main");
    const left = document.getElementById("left");
    const right = document.getElementById("right");
    const btn = document.getElementById("new");

    // 直前の問題を保存
    let lastQuestion = null;

    function generateQuestion() {
      let total, a, b, key;

      do {
        total = Math.floor(Math.random() * 8) + 3; // 3〜10
        a = Math.floor(Math.random() * (total - 1)) + 1;
        b = total - a;

        // 問題の一意キー（順序も含める）
        key = `${total}-${a}-${b}`;

      } while (key === lastQuestion);

      lastQuestion = key;

      main.textContent = total;
      left.textContent = a;

      right.textContent = "";
      right.dataset.answer = b;
      right.style.background = "#b0bec5";
    }

    right.addEventListener("click", () => {
      right.textContent = right.dataset.answer;
      right.style.background = "#fff";
    });

    btn.addEventListener("click", generateQuestion);

    generateQuestion();
  </script>

</body>
</html>
